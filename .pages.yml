media:
  input: images
  output: /images

content:
  - name: publications
    label: Travaux et publications
    type: collection
    path: publications
    format: json
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: date
        label: Date
        type: date
      - name: document
        label: Document PDF
        type: string